services:
  biblioteca:
    build: .
    container_name: gestor-biblioteca
    restart: unless-stopped
    # TOPE DE MEMORIA (Atom con 990 MB de RAM). Sin él, una ingesta pesada (poppler rasterizando un PDF grande,
    # o dos operaciones a la vez) consumía TODA la RAM+swap y CONGELABA el NAS entero: el demonio de Docker dejaba
    # de responder (`docker ps` colgado) y no quedaba ni RAM para que sshd diera el prompt. Con mem_limit el
    # contenedor NO puede pasar de ~700 MB de RAM → a DSM siempre le quedan ~290 MB físicos y sigue vivo; si el
    # gestor se pasa, el OOM mata un proceso DENTRO del contenedor y Docker lo reinicia (restart: unless-stopped),
    # en vez de tumbar la máquina. memswap_limit deja ~700 MB de swap de colchón antes de matar (picos puntuales
    # tiran de swap, pero acotado). Si ves reinicios por OOM frecuentes, se baja NODE_OPTIONS heap o la concurrencia.
    mem_limit: 700m
    memswap_limit: 1400m
    mem_reservation: 256m
    volumes:
      - /volume1/docker/GestorBiblioteca:/app
      - /app/node_modules
      - "/volume3/BIBLIOTECA DIGITAL/Inbox:/app/Inbox"
      - "/volume3/BIBLIOTECA DIGITAL/CDU:/app/CDU"
      - "/volume3/BIBLIOTECA DIGITAL/Cuarentena:/app/Cuarentena"
      - "/volume3/BIBLIOTECA DIGITAL/Reintentos:/app/Reintentos"
      - "/volume3/BIBLIOTECA DIGITAL/Recycling:/app/Recycling"
      - "/volume3/BIBLIOTECA DIGITAL/Fichero:/app/Fichero"
    ports:
      - "3000:3000"
      - "4000:4000"
    # NOTA: las CLAVES de IA (GEMINI_API_FREE_KEY_*, GEMINI_API_KEY_PAID, GROQ_API_KEY_*, OPENROUTER_API_KEY_*,
    # GOOGLE_BOOKS_API_KEY, EUROPEANA_API_KEY…) NO se listan aquí: las lee la app del .env montado en /app
    # (dotenv). Así añadir una clave nueva = editar .env, sin tocar este fichero. Aquí solo van las que deben
    # GANAR sobre el .env (paths a /app) y las pocas que conviene fijar explícitas.
    environment:
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - PATH_INBOX=/app/Inbox
      - PATH_CDU=/app/CDU
      - PATH_CUARENTENA=/app/Cuarentena
      - PATH_REINTENTOS=/app/Reintentos
      - PATH_RECICLAJE=/app/Recycling
      - PATH_FICHERO=/app/Fichero
      - PANEL_PORT=4000
      - ADMIN_PWD=${ADMIN_PWD}
      - GUEST_PWD=${GUEST_PWD:-guest}
      - TZ=${TZ:-Europe/Madrid}
      - NODE_OPTIONS=--max-old-space-size=512 --no-warnings

    working_dir: /app
    command: ["npm", "start"]

